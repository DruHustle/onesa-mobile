name: Onesa Mobile native compilation
'on':
  push:
    branches:
    - main
    paths:
    - onesa-mobile-frontend/mobile/**
    - .github/workflows/onesa-mobile-native-compile.yml
  # Both native jobs are required by main branch protection on every pull request.
  pull_request:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: onesa-mobile-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android debug compile (no release signing)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: onesa-mobile-frontend/mobile
    steps:
    - name: Verify hosted execution, visibility and included-allowance policy
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_PRIVATE: ${{ github.event.repository.private }}
        PRIVATE_VALIDATION_ENABLED: ${{ vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED }}
      run: |
        test "$RUNNER_ENVIRONMENT" = github-hosted
        actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq ".private")
        test "$actual" = "$EXPECTED_PRIVATE" || { echo "Repository visibility changed"; exit 1; }
        if [ "$actual" = true ] && [ "$PRIVATE_VALIDATION_ENABLED" != true ]; then
          echo "Private hosted verification requires explicit included-allowance opt-in"
          exit 1
        fi
      working-directory: .
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24.22.1
        cache: npm
        cache-dependency-path: onesa-mobile-frontend/mobile/package-lock.json
    - run: npm ci --no-audit --no-fund
    - name: Select the runner's JDK 17
      run: |
        test -d "$JAVA_HOME_17_X64"
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
    - name: Install the SDK versions pinned by React Native 0.88
      run: |
        test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006'
        # API 37 is published with a .0 suffix; RN's integer compileSdk expects this alias.
        # https://github.com/actions/runner-images/issues/13859
        test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
        if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
          ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
        fi
    - name: Compile the arm64 Android debug application
      run: |
        for attempt in 1 2 3; do
          build_log="$RUNNER_TEMP/mobile-android-build-$attempt.log"
          set +e
          refresh=()
          if [ "$attempt" -gt 1 ]; then refresh=(--refresh-dependencies); fi
          ./android/gradlew -p android :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --console=plain "${refresh[@]}" 2>&1 | tee "$build_log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -eq 0 ]; then
            exit 0
          fi
          # Retry only observed dependency download failures, keeping this job's cache.
          # Compilation and test errors retain their original nonzero exit status.
          if [ "$attempt" -eq 3 ] || ! grep -Eq 'Received status code (502|503|504)|Server returned HTTP response code: (502|503|504)|Downloading from https://.*failed: timeout|java\.net\.SocketTimeoutException|Could not find (org\.jetbrains\.kotlin:[a-z0-9-]+:2\.(2\.0|3\.0)|io\.github\.java-diff-utils:java-diff-utils:4\.15)' "$build_log"; then
            exit "$build_status"
          fi
          echo "Transient dependency download failure; retrying Android build ($attempt/3)."
          sleep "$((10 * attempt))"
        done
    - name: Confirm native APK output without uploading signing material
      run: test -s android/app/build/outputs/apk/debug/app-debug.apk
    - name: Retain the arm64 Android debug APK for pilot installation
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: onesa-mobile-android-arm64-debug-${{ github.sha }}
        path: onesa-mobile-frontend/mobile/android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}
        compression-level: 6
  ios:
    name: iOS simulator compile (unsigned)
    runs-on: macos-26
    timeout-minutes: 50
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: onesa-mobile-frontend/mobile
    steps:
    - name: Verify hosted execution, visibility and included-allowance policy
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_PRIVATE: ${{ github.event.repository.private }}
        PRIVATE_VALIDATION_ENABLED: ${{ vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED }}
      run: |
        test "$RUNNER_ENVIRONMENT" = github-hosted
        actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq ".private")
        test "$actual" = "$EXPECTED_PRIVATE" || { echo "Repository visibility changed"; exit 1; }
        if [ "$actual" = true ] && [ "$PRIVATE_VALIDATION_ENABLED" != true ]; then
          echo "Private hosted verification requires explicit included-allowance opt-in"
          exit 1
        fi
      working-directory: .
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 2
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24.22.1
        cache: npm
        cache-dependency-path: onesa-mobile-frontend/mobile/package-lock.json
    - run: npm ci --no-audit --no-fund
    - name: Record installed native toolchain versions
      run: |
        xcodebuild -version
        pod --version
    - name: Prepare Xcode environment from the public template
      run: npm run prepare:ios
    - name: Install generated native module pods
      run: pod install --project-directory=ios
    - name: Select generic device validation for manual or native-source changes
      id: device
      working-directory: .
      run: |
        if [[ "$GITHUB_EVENT_NAME" != pull_request ]] || git diff --name-only HEAD^1 HEAD | grep -E '^((onesa-mobile-frontend/mobile/.*|scripts/ios-device-distribution\.sh|.github/workflows/onesa-mobile-native-compile\.yml))$' > /dev/null; then
          echo 'needed=true' >> "$GITHUB_OUTPUT"
        fi
    - name: Check the release archive for real Apple device architecture
      if: steps.device.outputs.needed == 'true'
      env:
        EXPO_PUBLIC_API_BASE_URL: https://mobile.onesa.eu/api
      run: |
        archive="$RUNNER_TEMP/OnesaMobilePreview-device.xcarchive"
        trap 'rm -rf "$archive"' EXIT
        bash "$GITHUB_WORKSPACE/scripts/ios-device-distribution.sh" check "$archive"
    - name: Compile the standalone iPhone and iPad simulator target
      env:
        EXPO_PUBLIC_API_BASE_URL: https://mobile.onesa.eu/api
      run: |
        xcodebuild -workspace ios/OnesaMobilePreview.xcworkspace -scheme OnesaMobilePreview -configuration Release \
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath .validation/ios-build \
          CODE_SIGNING_ALLOWED=NO build
    - name: Verify embedded JavaScript and retain the standalone simulator app
      run: |
        products=.validation/ios-build/Build/Products/Release-iphonesimulator
        test -s "$products/OnesaMobilePreview.app/main.jsbundle"
        mkdir -p native-artifacts
        tar -czf native-artifacts/OnesaMobilePreview-simulator.tar.gz -C "$products" OnesaMobilePreview.app
    - name: Retain the unsigned iOS simulator application
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: onesa-mobile-ios-simulator-standalone-unsigned-${{ github.sha }}
        path: onesa-mobile-frontend/mobile/native-artifacts/OnesaMobilePreview-simulator.tar.gz
        if-no-files-found: error
        retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}
        compression-level: 0
    - name: Install and cold-launch the retained simulator app without Metro
      run: |
        # A shared runner may retain an unusable simulator migration.
        # Use a fresh disposable device and allow one replacement after a real
        # boot failure; do not bypass the installed application check.
        read -r device_type runtime < <(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(*next((d["deviceTypeIdentifier"],r) for r,ds in sorted(json.load(sys.stdin)["devices"].items(), reverse=True) if ".iOS-" in r for d in ds if d["name"].startswith("iPhone") and d["isAvailable"]))')
        device=''
        cleanup_device() {
          if [[ -n "$device" ]]; then
            xcrun simctl shutdown "$device" >/dev/null 2>&1 || true
            xcrun simctl delete "$device" >/dev/null 2>&1 || true
          fi
        }
        trap cleanup_device EXIT
        booted=false
        for attempt in 1 2; do
          device=$(xcrun simctl create "Onesa Mobile CI $GITHUB_RUN_ID-$attempt" "$device_type" "$runtime")
          if xcrun simctl boot "$device" && python3 -c 'import subprocess,sys; subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"],check=True,timeout=180)' "$device"; then
            booted=true
            break
          fi
          cleanup_device
          device=''
        done
        [[ "$booted" == true ]] || { echo "No fully booted iPhone simulator is available." >&2; exit 1; }
        xcrun simctl install "$device" .validation/ios-build/Build/Products/Release-iphonesimulator/OnesaMobilePreview.app
        xcrun simctl launch "$device" eu.onesa.mobile.preview
        cat > "$RUNNER_TEMP/read-release-screen.swift" <<'SWIFT'
        import Foundation
        import Vision
        let request = VNRecognizeTextRequest()
        request.recognitionLevel = .accurate
        try VNImageRequestHandler(url: URL(fileURLWithPath: CommandLine.arguments[1])).perform([request])
        let lines = (request.results ?? []).compactMap { $0.topCandidates(1).first?.string.lowercased() }
        let screen = lines.joined(separator: " ")
        if screen.contains("your mobile account") {
            print("The installed standalone iPhone simulator application rendered Your mobile account.")
        } else {
            print("Observed public first-launch text: " + screen)
            exit(1)
        }
        SWIFT
        xcrun swiftc "$RUNNER_TEMP/read-release-screen.swift" -o "$RUNNER_TEMP/read-release-screen"
        for attempt in {1..15}; do
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/mobile-first-screen.png"
          if "$RUNNER_TEMP/read-release-screen" "$RUNNER_TEMP/mobile-first-screen.png"; then exit 0; fi
          sleep 2
        done
        exit 1
